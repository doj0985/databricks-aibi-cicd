# This is a Databricks asset bundle definition for biops.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
#
# NOTE: This config currently points all targets at a Databricks Free Edition
# workspace (no IP access lists) so the full dev -> staging -> prod promotion can
# be exercised end-to-end from GitHub Actions runners. Swap the host/warehouse/SP
# back to the real workspaces for production use.
bundle:
  name: biops

include:
  - resources/*.yml

variables:
  warehouse_id:
    description: SQL warehouse ID to use for the dashboard
  service_principal_id:
    description: Application (client) ID of the CI/CD service principal used to deploy
    default: cd69a690-2381-46ad-811e-cbf80f5406ae  # biops-cicd-test (Free Edition)

targets:
  dev:
    # Local target for validation and generate commands. Not used for deployment.
    default: true
    variables:
      warehouse_id: 38d92bfbd6fca9c0
    workspace:
      host: https://dbc-962d4f8a-27db.cloud.databricks.com

  staging:
    mode: production
    variables:
      warehouse_id: 38d92bfbd6fca9c0
    presets:
      name_prefix: 'staging_'
      tags:
        env: staging
    workspace:
      host: https://dbc-962d4f8a-27db.cloud.databricks.com
    permissions:
      - service_principal_name: ${var.service_principal_id}
        level: CAN_MANAGE
    run_as:
      service_principal_name: ${var.service_principal_id}

  prod:
    mode: production
    variables:
      warehouse_id: 38d92bfbd6fca9c0
    presets:
      name_prefix: 'production_'
      tags:
        env: prod
    workspace:
      host: https://dbc-962d4f8a-27db.cloud.databricks.com
    permissions:
      - service_principal_name: ${var.service_principal_id}
        level: CAN_MANAGE
    run_as:
      service_principal_name: ${var.service_principal_id}
