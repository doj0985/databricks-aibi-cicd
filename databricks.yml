# This is a Databricks asset bundle definition for biops.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: biops

include:
  - resources/*.yml

variables:
  warehouse_id:
    description: SQL warehouse ID to use for the dashboard

targets:
  dev:
    # Local target for validation and generate commands. Not used for deployment.
    default: true
    variables:
      warehouse_id: 27a3fd0190890b59
    workspace:
      host: https://fe-vm-aibi-embedded-analytics.cloud.databricks.com

  staging:
    mode: production
    variables:
      warehouse_id: 27a3fd0190890b59  # TODO: replace with actual staging warehouse ID
    presets:
      name_prefix: 'staging_'
      tags:
        staging: 'true'
    workspace:
      host: https://fe-vm-aibi-embedded-analytics.cloud.databricks.com
      root_path: /Workspace/Users/doyoung.jung@databricks.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: doyoung.jung@databricks.com
        level: CAN_MANAGE
    run_as:
      user_name: doyoung.jung@databricks.com

  prod:
    mode: production
    variables:
      warehouse_id: 27a3fd0190890b59
    presets:
      name_prefix: 'production_'
      tags:
        prod: 'true'
    workspace:
      host: https://fe-vm-aibi-embedded-analytics.cloud.databricks.com
      # We explicitly specify /Workspace/Users/doyoung.jung@databricks.com to make sure we only have a single copy.
      root_path: /Workspace/Users/doyoung.jung@databricks.com/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - user_name: doyoung.jung@databricks.com
        level: CAN_MANAGE
    run_as:
      user_name: doyoung.jung@databricks.com
