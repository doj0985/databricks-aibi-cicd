# This is a Databricks asset bundle definition for biops.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: biops

include:
  - resources/*.yml

variables:
  warehouse_id:
    description: SQL warehouse ID to use for the dashboard

targets:
  dev:
    # Local target for validation and generate commands. Not used for deployment.
    default: true
    variables:
      warehouse_id: 27a3fd0190890b59
    workspace:
      host: https://fe-vm-aibi-embedded-analytics.cloud.databricks.com

  staging:
    mode: production
    variables:
      warehouse_id: 27a3fd0190890b59
    presets:
      name_prefix: 'staging_'
      tags:
        env: staging
    workspace:
      host: https://fe-vm-aibi-embedded-analytics.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - service_principal_name: 98e53e4a-a40f-4859-a9f9-2be80c43e222  # github_actions_aibi_cicd (app ID, not display name)
        level: CAN_MANAGE
      - user_name: doyoung.jung@databricks.com
        level: CAN_RUN
    run_as:
      service_principal_name: 98e53e4a-a40f-4859-a9f9-2be80c43e222  # github_actions_aibi_cicd (app ID, not display name)

  prod:
    mode: production
    variables:
      warehouse_id: 27a3fd0190890b59
    presets:
      name_prefix: 'production_'
      tags:
        env: prod
    workspace:
      host: https://fe-vm-aibi-embedded-analytics.cloud.databricks.com
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    permissions:
      - service_principal_name: 98e53e4a-a40f-4859-a9f9-2be80c43e222  # github_actions_aibi_cicd (app ID, not display name)
        level: CAN_MANAGE
      - user_name: doyoung.jung@databricks.com
        level: CAN_RUN
    run_as:
      service_principal_name: 98e53e4a-a40f-4859-a9f9-2be80c43e222  # github_actions_aibi_cicd (app ID, not display name)
